<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prime Roofing & Property Maintenance | Skipton</title>

<style>

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}

html {

    scroll-behavior: smooth;

}

body {

    font-family: Arial, Helvetica, sans-serif;

    background: #000;

}

/* HERO */

.hero {

    min-height: 100vh;

    position: relative;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    padding-bottom: 90px;

    background:

        linear-gradient(

            rgba(0,0,0,0.18),

            rgba(0,0,0,0.42)

        ),

        url("IMG_0740.jpeg") center center / cover no-repeat;

}

/* LOGO */

.logo {

    position: absolute;

    top: 25px;

    left: 30px;

    width: 200px;

    max-height: 100px;

    object-fit: contain;

}

/* BUTTONS */

.buttons {

    display: flex;

    gap: 16px;

    width: auto;

}

.btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    min-width: 190px;

    padding: 16px 28px;

    border-radius: 7px;

    font-size: 16px;

    font-weight: 800;

    text-decoration: none;

    transition: 0.2s ease;

}

.quote {

    background: #ffffff;

    color: #04552f;

}

.quote:hover {

    background: #eef8f2;

    transform: translateY(-2px);

}

.work {

    background: #087443;

    color: #ffffff;

}

.work:hover {

    background: #04552f;

    transform: translateY(-2px);

}

/* OUR WORK */

#work {

    background: #ffffff;

    padding: 60px 20px;

}

.gallery {

    max-width: 1200px;

    margin: auto;

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 15px;

}

.gallery img {

    width: 100%;

    height: 300px;

    object-fit: cover;

    border-radius: 10px;

    display: block;

    cursor: pointer;

    transition: 0.25s ease;

}

.gallery img:hover {

    transform: scale(1.02);

}

/* MOBILE */

@media (max-width: 600px) {

    .hero {

        min-height: 100vh;

        padding: 0 20px 55px;

        align-items: flex-end;

    }

    .logo {

        width: 155px;

        top: 20px;

        left: 20px;

    }

    .buttons {

        width: 100%;

        flex-direction: column;

        gap: 12px;

    }

    .btn {

        width: 100%;

        min-width: 0;

        padding: 16px 20px;

        font-size: 16px;

    }

    #work {

        padding: 35px 12px;

    }

    .gallery {

        grid-template-columns: 1fr;

        gap: 12px;

    }

    .gallery img {

        height: 250px;

    }

}

</style>

</head>

<body>

<!-- HERO -->

<section class="hero">

    <img

        class="logo"

        src="IMG_0641.jpeg"

        alt="Prime Roofing & Property Maintenance"

    >

    <div class="buttons">

        <a

            class="btn quote"

            href="tel:07709671724"

        >

            Get a Free Quote

        </a>

        <a

            class="btn work"

            href="#work"

        >

            View Our Work

        </a>

    </div>

</section>

<!-- OUR WORK -->

<section id="work">

    <div class="gallery">

        <img src="IMG_0103.jpeg" alt="Roofing work">

        <img src="IMG_0104.jpeg" alt="Roofing work">

        <img src="IMG_0105.jpeg" alt="Roofing work">

        <img src="IMG_0316.jpeg" alt="Roofing work">

        <img src="IMG_0327.jpeg" alt="Roofing work">

        <img src="IMG_0496.jpeg" alt="Roofing work">

        <img src="IMG_0548.jpeg" alt="Roofing work">

        <img src="IMG_0734.jpeg" alt="Roofing work">

        <img src="IMG_0740.jpeg" alt="Roofing work">

        <img src="IMG_3856.jpeg" alt="Roofing work">

        <img src="IMG_3862.jpeg" alt="Roofing work">

        <img src="IMG_3882.png" alt="Roofing work">

        <img src="IMG_4506.jpeg" alt="Roofing work">

        <img src="IMG_3185.jpeg" alt="Roofing work">

        <img src="IMG_3219.jpeg" alt="Roofing work">

        <img src="IMG_3232.jpeg" alt="Roofing work">

        <img src="IMG_3304.jpeg" alt="Roofing work">

        <img src="IMG_3511.jpeg" alt="Roofing work">

        <img src="IMG_3713.jpeg" alt="Roofing work">

        <img src="IMG_3721.jpeg" alt="Roofing work">

        <img src="IMG_3724.jpeg" alt="Roofing work">

        <img src="IMG_3753.jpeg" alt="Roofing work">

    </div>

</section>

</body>

</html>
